name: Android release APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-release.yml"
      - "android-app/**"
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plamo-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and sign release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out public application source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 36 SDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0" || test "${PIPESTATUS[1]}" -eq 0

      - name: Configure Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Download verified official Android ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plamo-native"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/plamo-native/llama.tar.gz" \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12138/llama-b12138-bin-android-arm64.tar.gz"
          echo "8e1dfb4a6b401506f275e6ec861a740569ae1ef4deb196501e5eb035cf7e5d82  $RUNNER_TEMP/plamo-native/llama.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/plamo-native/llama.tar.gz" -C "$RUNNER_TEMP/plamo-native"
          native="$RUNNER_TEMP/plamo-native/llama-b12138"
          target="android-app/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$target"
          # Package llama-server as an executable Android native library.
          test -s "$native/llama-server"
          cp "$native/llama-server" "$target/libplamo_server.so"
          cp "$native"/lib*.so "$target/"
          test -s "$target/libllama.so"
          test -s "$target/libllama-server-impl.so"
          test -s "$target/libllama-common.so"
          test -s "$target/libggml.so"

      - name: Compile unsigned non-debug release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android-app assembleRelease
          test -s android-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign with persistent release signing key
        shell: bash
        env:
          PLAMO_KEYSTORE_B64: ${{ secrets.PLAMO_KEYSTORE_B64 }}
          PLAMO_STORE_PASSWORD: ${{ secrets.PLAMO_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ -n "$PLAMO_KEYSTORE_B64" && -n "$PLAMO_STORE_PASSWORD" ]]; then
            printf '%s' "$PLAMO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/plamo-release.p12"
            chmod 600 "$RUNNER_TEMP/plamo-release.p12"
            echo "Using persistent release signing key from GitHub Actions secrets."
          else
            # This still produces a signed release (not a debug APK), but
            # its new certificate cannot be reused for app upgrades.
            echo "::warning::No signing secrets configured: generating a one-time release key. Future updates may require uninstall/reinstall."
            PLAMO_STORE_PASSWORD="$(openssl rand -hex 32)"
            export PLAMO_STORE_PASSWORD
            keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 3650 \
              -storetype PKCS12 -keystore "$RUNNER_TEMP/plamo-release.p12" \
              -storepass "$PLAMO_STORE_PASSWORD" -keypass "$PLAMO_STORE_PASSWORD" \
              -alias plamo-release \
              -dname "CN=PLaMo Select Translation, O=poteto, C=JP"
            echo "EPHEMERAL_SIGNING=true" >> "$GITHUB_ENV"
          fi
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned="android-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/plamo-release-aligned.apk"
          final="dist/PLaMo-Select-v0.3.0-release.apk"
          "$build_tools/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/plamo-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias plamo-release \
            --ks-pass env:PLAMO_STORE_PASSWORD \
            --out "$final" "$aligned"
          "$build_tools/zipalign" -c -v 4 "$final"
          "$build_tools/apksigner" verify --verbose --print-certs "$final"
          sha256sum "$final"

      - name: Upload signed APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLaMo-Select-v0.3.0-release
          path: dist/PLaMo-Select-v0.3.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.3.0"
          file="dist/PLaMo-Select-v0.3.0-release.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" \
              --title "PLaMo Select v0.3.0 (signed release APK)" \
              --notes "v0.3.0: Google Translate-inspired Material UI with separate source/target cards, full-screen home and floating selection popup, one-tap copy/share/swap/speak/replace, PLaMo 3 model support, and a persistent local model service. Signed non-debug release APK, built by public GitHub Actions. Signing is one-time until persistent repository signing secrets are configured; app updates may require reinstall. Android 8+ / ARM64. PLaMo GGUF model is not included and must be imported after installation. Offline inference uses the official ggml-org/llama.cpp b12138 Android ARM64 runtime."
          fi
