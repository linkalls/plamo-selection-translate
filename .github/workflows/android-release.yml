name: Android release APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-release.yml"
      - "android-app/**"
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plamo-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and sign release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out public application source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 36 SDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0" || test "${PIPESTATUS[1]}" -eq 0

      - name: Configure Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Download verified official Android ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plamo-native"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/plamo-native/llama.tar.gz" \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12138/llama-b12138-bin-android-arm64.tar.gz"
          echo "8e1dfb4a6b401506f275e6ec861a740569ae1ef4deb196501e5eb035cf7e5d82  $RUNNER_TEMP/plamo-native/llama.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/plamo-native/llama.tar.gz" -C "$RUNNER_TEMP/plamo-native"
          native="$RUNNER_TEMP/plamo-native/llama-b12138"
          target="android-app/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$target"
          # Package llama-server as an executable Android native library.
          test -s "$native/llama-server"
          cp "$native/llama-server" "$target/libplamo_server.so"
          cp "$native"/lib*.so "$target/"
          test -s "$target/libllama.so"
          test -s "$target/libllama-server-impl.so"
          test -s "$target/libllama-common.so"
          test -s "$target/libggml.so"

      - name: Compile unsigned non-debug release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android-app assembleRelease
          test -s android-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign with persistent release signing key
        shell: bash
        env:
          PLAMO_KEYSTORE_B64: ${{ secrets.PLAMO_KEYSTORE_B64 }}
          PLAMO_STORE_PASSWORD: ${{ secrets.PLAMO_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Never silently rotate the Android app signing identity.
          # A missing secret must fail CI instead of making a one-time key.
          if [[ -z "$PLAMO_KEYSTORE_B64" || -z "$PLAMO_STORE_PASSWORD" ]]; then
            echo "::error::Persistent APK signing secrets are missing. Refusing to generate an ephemeral signing key."
            exit 1
          fi
          printf '%s' "$PLAMO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/plamo-release.p12"
          chmod 600 "$RUNNER_TEMP/plamo-release.p12"
          echo "Using the registered persistent PLaMo release signing certificate."
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned="android-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/plamo-release-aligned.apk"
          final="dist/PLaMo-Select-v0.8.0-release.apk"
          "$build_tools/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/plamo-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias plamo-release \
            --ks-pass env:PLAMO_STORE_PASSWORD \
            --out "$final" "$aligned"
          "$build_tools/zipalign" -c -v 4 "$final"
          "$build_tools/apksigner" verify --verbose --print-certs "$final"
          # Pin the public certificate fingerprint. A different key is a hard
          # failure, even if someone accidentally replaces the Actions secret.
          expected_cert="79d5c66d70b220859285137ee94d4bd44865c6a2519820df289b92214f70425b"
          actual_cert="$("$build_tools/apksigner" verify --print-certs "$final" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::APK signing certificate differs from the pinned release certificate."
            exit 1
          fi
          echo "Stable release signing certificate verified: $actual_cert"
          sha256sum "$final"

      - name: Upload signed APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLaMo-Select-v0.8.0-release
          path: dist/PLaMo-Select-v0.8.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.8.0"
          file="dist/PLaMo-Select-v0.8.0-release.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" \
              --title "PLaMo Select v0.8.0 (signed release APK)" \
              --notes "v0.8.0: Use a persistent production signing key via private GitHub Actions secrets and verify the pinned certificate fingerprint. Preserve the paragraph-context translation update and all previous app features. Android in-place upgrades are supported for future builds signed with this certificate. Older ephemeral-key APKs are not signature-compatible. Android 8+ / ARM64. PLaMo GGUF model is not included and must be imported after installation. Offline inference uses the official ggml-org/llama.cpp b12138 Android ARM64 runtime."
          fi
